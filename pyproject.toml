[project]
name = "nexus-academy"
version = "0.1.0"
description = "Nexus, el asistente de Metro de Vilaverda: proyecto de ejercicios de observabilidad y evaluación con Langfuse"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "langchain>=1.3,<2",
    "langchain-core>=1.5,<2",
    "langchain-groq>=1.0",
    "langchain-ollama>=1.1",
    "langchain-openai>=1.4",
    "langfuse>=5,<6",
    "langgraph>=1.2,<2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[project.scripts]
agent = "nexus.cli:agent"
prompts = "nexus.cli:prompts"
index = "nexus.cli:index"
dataset = "evaluation.upload:main"
experiment = "evaluation.experiment:main"
judge-agreement = "evaluation.agreement:main"
trazas-cap3 = "evaluation.trazas_cap3:main"
seed = "nexus.seed:main"
check = "nexus.checks:main"
release = "release.cli:release"
simulate = "release.cli:simulate"
alarma = "release.cli:alarma"
help = "nexus.cli:show_help"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus", "evaluation", "release"]

[dependency-groups]
dev = [
    "pyright>=1.1.381",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["nexus", "evaluation", "release", "ejercicios", "tests"]
